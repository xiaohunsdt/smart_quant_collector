global:
  environment: "production"
  log_level: "debug"
  cpu_affinity: true
  log_file_path: "./log/collector.log"

threading_matrix:
  network_core: 2
  parser_cores: [3, 4]
  storage_core: 5
  pub_core: 6
  telemetry_core: 7

telemetry:
  prometheus_enabled: true
  listen_port: 8080
  report_interval_ms: 1000

pub:
  tcp_endpoint: "tcp://*:5555"
  ipc_endpoint: "ipc:///tmp/collector_pub.ipc"

storage:
  persist_to_disk: true
  use_engine: "csv"
  dolphindb:
    host: "127.0.0.1"
    port: 8848
    user: "admin"
    password: "123"
    buffer_size: 2000
    flush_interval_ms: 10
  mmap:
    output_path: "./mmap_cache/"
    sync_interval_records: 10000
  csv:
    output_path: "./trade_data/"

exchanges:
  - name: "binance"
    enabled: true
    channels:
      - type: spot
        symbols:
          - name: "BTCUSDT"
            depth_level: 10
            record_tick: true
          - name: "ETHUSDT"
            depth_level: 10
            record_tick: true
          - name: "SOLUSDT"
            depth_level: 10
            record_tick: true
      - type: perpetual
        symbols:
          - name: "BTCUSDT"
            depth_level: 10
            record_tick: true
          - name: "ETHUSDT"
            depth_level: 10
            record_tick: true
          - name: "SOLUSDT"
            depth_level: 10
            record_tick: true
  - name: "gateio"
    enabled: true
    channels:
      - type: spot
        symbols:
          - name: "BTC_USDT"
            depth_level: 10
            record_tick: true
          - name: "ETH_USDT"
            depth_level: 10
            record_tick: true
          - name: "SOL_USDT"
            depth_level: 10
            record_tick: true
      - type: perpetual
        symbols:
          - name: "BTC_USDT"
            enabled: true
            depth_level: 10
            record_tick: true
          - name: "ETH_USDT"
            depth_level: 10
            record_tick: true
          - name: "SOL_USDT"
            depth_level: 10
            record_tick: true
