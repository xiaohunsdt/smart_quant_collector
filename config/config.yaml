global:
  environment: "production"
  log_level: "info"
  cpu_affinity: true
  log_file_path: "./log/collector.log"

threading_matrix:
  network_core: 2
  parser_cores: [3, 4]
  storage_core: 5
  pub_core: 6
  telemetry_core: 7

telemetry:
  prometheus_enabled: true
  listen_port: 8080
  report_interval_ms: 1000

pub:
  tcp_endpoint: "tcp://*:5555"
  ipc_endpoint: "ipc:///tmp/collector_pub.ipc"

storage:
  persist_to_disk: true
  use_engine: "dolphindb"
  dolphindb:
    host: "192.168.11.139"
    port: 8848
    user: "admin"
    password: "123456"
    buffer_size: 2000
    flush_interval_ms: 10
    mtw_batch_size: 20000
    mtw_throttle_sec: 1.0
    mtw_thread_count: 4
    auto_init_schema: true
    health_check_interval_ms: 5000
    dfs_db_path: "dfs://trade_db"
    hash_buckets: 20
    partition_granularity: "day"  # "day" | "month" | "year"
  mmap:
    output_path: "./mmap_cache/"
    sync_interval_records: 10000
  csv:
    output_path: "./trade_data/"

exchanges:
  - name: "binance"
    enabled: true
    channels:
      - type: spot
        symbols:
          - name: "BTCUSDT"
            depth_level: 10
            record_tick: true
          - name: "ETHUSDT"
            depth_level: 10
            record_tick: true
          - name: "SOLUSDT"
            depth_level: 10
            record_tick: true
      - type: perpetual
        symbols:
          - name: "BTCUSDT"
            depth_level: 10
            record_tick: true
          - name: "ETHUSDT"
            depth_level: 10
            record_tick: true
          - name: "SOLUSDT"
            depth_level: 10
            record_tick: true
  - name: "gateio"
    enabled: true
    channels:
      - type: spot
        symbols:
          - name: "BTC_USDT"
            depth_level: 10
            record_tick: true
          - name: "ETH_USDT"
            depth_level: 10
            record_tick: true
          - name: "SOL_USDT"
            depth_level: 10
            record_tick: true
  - name: "rithmic"
    enabled: false
    rithmic:
      mode: "paper"
      user: "${RITHMIC_USER}"
      password: "${RITHMIC_PASSWORD}"
      engine_core: 8
      forwarder_core: 9
      depth_level: 10
    channels:
      - type: futures
        symbols:
          - name: "ES"
            depth_level: 10
          - name: "NQ"
            depth_level: 10

